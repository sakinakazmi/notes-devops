services:
  web:
    image: sakinaabbas/notes-app:v1
    container_name: notes-web
    ports:
      - "8081:5000"
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notes
      DB_PASSWORD: notes_pass
      APP_ENV: "Part I"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: notes-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes_pass
    volumes:
      - notes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  notes_pgdata:
